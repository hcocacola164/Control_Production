<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display de Planta - Control de Producción</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .completed-row {
      background-color: rgba(16, 185, 129, 0.15) !important;
      opacity: 0.6;
      text-decoration: line-through;
    }
    .highlight-green {
      background-color: rgba(34, 197, 94, 0.25) !important;
      border-left: 4px solid #22c55e !important;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans select-none">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 flex flex-wrap justify-between items-center gap-3 shadow-lg">
    <div class="flex items-center space-x-3">
      <img src="logo.png.JPG" alt="Logo Empresa" class="h-10 w-auto max-w-[120px] object-contain bg-white/5 rounded px-2 py-1" onerror="this.style.display='none'">
      <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
      <h1 class="text-lg md:text-xl font-bold tracking-wide uppercase">Mabesal</h1>
    </div>

    <div class="flex items-center space-x-3">
      <div class="flex items-center space-x-2 bg-slate-700/60 px-3 py-1.5 rounded-lg border border-slate-600">
        <label for="week-select" class="text-xs font-bold uppercase text-slate-300">Semana:</label>
        <select id="week-select" onchange="changeWeek()" class="bg-slate-800 text-emerald-400 font-bold text-sm rounded px-2 py-1 outline-none border border-slate-600 cursor-pointer">
          <option value="">Cargando...</option>
        </select>
      </div>

      <button onclick="toggleFullscreen()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-600 font-bold text-xs flex items-center space-x-1 transition" title="Pantalla completa">
        <span>⛶</span>
        <span class="hidden md:inline">Kiosco</span>
      </button>

      <div class="text-xs md:text-sm text-slate-400 text-right">
        Última actualización: <span id="last-updated" class="font-mono text-emerald-400">Cargando...</span>
      </div>
    </div>
  </header>

  <!-- Navegación -->
  <nav class="bg-slate-800/50 p-2 flex flex-wrap space-x-2 border-b border-slate-700 gap-2">
    <button id="btn-prod" onclick="switchTab('PROD')" class="flex-1 py-3 px-2 rounded-lg font-semibold text-center transition bg-blue-600 text-white shadow-md text-sm md:text-base">
      📋 Producción
    </button>
    <button id="btn-mas" onclick="switchTab('MAS')" class="flex-1 py-3 px-2 rounded-lg font-semibold text-center transition bg-slate-700 text-slate-300 hover:bg-slate-600 text-sm md:text-base">
      🛠️ Masillado
    </button>
    <button id="btn-esc" onclick="switchTab('ESC')" class="flex-1 py-3 px-2 rounded-lg font-semibold text-center transition bg-slate-700 text-slate-300 hover:bg-slate-600 text-sm md:text-base">
      📐 Escuadradora
    </button>
    <button id="btn-lij" onclick="switchTab('LIJ')" class="flex-1 py-3 px-2 rounded-lg font-semibold text-center transition bg-slate-700 text-slate-300 hover:bg-slate-600 text-sm md:text-base">
      🪚 Lijadora
    </button>
    <button id="btn-mue" onclick="switchTab('MUE')" class="flex-1 py-3 px-2 rounded-lg font-semibold text-center transition bg-slate-700 text-slate-300 hover:bg-slate-600 text-sm md:text-base">
      📦 Muelle
    </button>
    <button id="btn-mant" onclick="switchTab('MANT')" class="py-3 px-4 rounded-lg font-semibold text-center transition bg-amber-600 text-white shadow-md text-sm md:text-base flex items-center space-x-1">
      <span>🔧 Mantenimiento</span>
      <span id="mant-badge" class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full font-bold hidden">0</span>
    </button>
  </nav>

  <!-- Barra de Filtro, Progreso y Alerta -->
  <div id="controls-bar" class="bg-slate-800/80 px-4 py-3 flex flex-wrap justify-between items-center gap-3 border-b border-slate-700">
    <div class="flex items-center space-x-2 w-full sm:w-auto flex-1 max-w-md">
      <span class="text-slate-400">🔍</span>
      <input type="text" id="search-input" oninput="filterTable()" placeholder="Buscar por OF, cliente, chapa..." class="w-full bg-slate-900 text-slate-200 text-sm rounded-lg px-3 py-2 border border-slate-700 outline-none focus:border-blue-500">
    </div>
    
    <div class="flex items-center space-x-3">
      <button onclick="openAlertModal()" class="bg-red-600 hover:bg-red-500 text-white px-3 py-2 rounded-lg font-bold text-xs flex items-center space-x-1 shadow transition animate-pulse">
        <span>🚨</span>
        <span>Avisar Mantenimiento</span>
      </button>
      <div id="progress-counter" class="text-xs md:text-sm font-semibold text-slate-300 bg-slate-900/60 px-3 py-2 rounded-lg border border-slate-700/50">
        Progreso: <span class="text-emerald-400 font-bold">0 / 0 (0%)</span>
      </div>
    </div>
  </div>

  <!-- Contenido principal -->
  <main class="flex-1 p-4 overflow-auto">
    <div class="bg-slate-800 rounded-xl shadow-xl overflow-hidden border border-slate-700">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-700/80 uppercase text-xs font-bold text-slate-200">
            <tr id="table-headers"></tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-700"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal para avisos -->
  <div id="alert-modal" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center hidden p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-md shadow-2xl">
      <h3 class="text-lg font-bold text-red-400 mb-2 flex items-center space-x-2">
        <span>🚨</span>
        <span>Aviso a Mantenimiento</span>
      </h3>
      <p class="text-xs text-slate-400 mb-4">Se enviará una alerta en tiempo real a la pantalla del taller de mantenimiento.</p>
      
      <label class="block text-xs font-bold uppercase text-slate-300 mb-1">¿Qué incidencia hay?</label>
      <textarea id="alert-message" rows="4" placeholder="Ej: Atasco en rodillos principales, ruido extraño en motor..." class="w-full bg-slate-900 text-slate-100 text-sm rounded-lg p-3 border border-slate-700 outline-none focus:border-red-500 resize-none mb-4"></textarea>

      <div class="flex space-x-3">
        <button onclick="closeAlertModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold py-2.5 rounded-lg transition text-sm">Cancelar</button>
        <button onclick="sendMaintenanceAlert()" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-2.5 rounded-lg transition text-sm shadow">Enviar Alerta</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyJq7f4P2Qeb6lC0CurkQZTg5gVGyBJJtuVdX5A515JZeo0NnMAFEeOpggLt8ududNN/exec"; 

    let fullData = { weeks: [], data: {}, alerts: [] };
    let currentWeek = "";
    let currentSection = "PROD";
    let completedRows = JSON.parse(localStorage.getItem('completedRows') || '{}');

    async function fetchData() {
      try {
        const response = await fetch(API_URL);
        fullData = await response.json();
        document.getElementById('last-updated').innerText = fullData.lastUpdated;

        updateWeekSelector();
        updateMaintenanceBadge();
        renderCurrentTable();
      } catch (error) {
        console.error("Error al obtener datos:", error);
        document.getElementById('last-updated').innerText = "Error de conexión";
      }
    }

    function updateWeekSelector() {
      const select = document.getElementById('week-select');
      if (!fullData.weeks || !fullData.weeks.length) {
        select.innerHTML = `<option value="">Sin datos</option>`;
        return;
      }

      if (!currentWeek || !fullData.weeks.includes(currentWeek)) {
        currentWeek = fullData.weeks[fullData.weeks.length - 1];
      }

      select.innerHTML = fullData.weeks.map(w => 
        `<option value="${w}" ${w === currentWeek ? 'selected' : ''}>${w}</option>`
      ).join('');
    }

    function updateMaintenanceBadge() {
      const alerts = fullData.alerts || [];
      const pendingCount = alerts.filter(a => String(a.Estado || a.ESTADO || '').toUpperCase() === 'PENDIENTE').length;
      const badge = document.getElementById('mant-badge');
      if (pendingCount > 0) {
        badge.innerText = pendingCount;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function changeWeek() {
      currentWeek = document.getElementById('week-select').value;
      renderCurrentTable();
    }

    function switchTab(section) {
      currentSection = section;
      
      const btnMap = { 'PROD': 'btn-prod', 'MAS': 'btn-mas', 'ESC': 'btn-esc', 'LIJ': 'btn-lij', 'MUE': 'btn-mue', 'MANT': 'btn-mant' };
      Object.keys(btnMap).forEach(sec => {
        const btn = document.getElementById(btnMap[sec]);
        if (btn) {
          if (sec === 'MANT') {
            btn.className = sec === section 
              ? "py-3 px-4 rounded-lg font-semibold text-center transition bg-amber-600 text-white shadow-md text-sm md:text-base flex items-center space-x-1 ring-2 ring-white/30" 
              : "py-3 px-4 rounded-lg font-semibold text-center transition bg-slate-700 text-slate-300 hover:bg-slate-600 text-sm md:text-base flex items-center space-x-1";
          } else {
            btn.className = sec === section 
              ? "flex-1 py-3 px-2 rounded-lg font-semibold text-center transition bg-blue-600 text-white shadow-md text-sm md:text-base" 
              : "flex-1 py-3 px-2 rounded-lg font-semibold text-center transition bg-slate-700 text-slate-300 hover:bg-slate-600 text-sm md:text-base";
          }
        }
      });

      const controlsBar = document.getElementById('controls-bar');
      if (section === 'MANT') {
        controlsBar.style.display = 'none';
      } else {
        controlsBar.style.display = 'flex';
      }

      renderCurrentTable();
    }

    function openAlertModal() {
      document.getElementById('alert-modal').classList.remove('hidden');
      document.getElementById('alert-message').value = '';
    }

    function closeAlertModal() {
      document.getElementById('alert-modal').classList.add('hidden');
    }

    async function sendMaintenanceAlert() {
      const msg = document.getElementById('alert-message').value.trim();
      if (!msg) {
        alert("Por favor, escribe brevemente la incidencia.");
        return;
      }

      const sectionNames = { 'PROD': 'Órdenes de Producción', 'MAS': 'Masillado', 'ESC': 'Escuadradora', 'LIJ': 'Lijadora', 'MUE': 'Muelle' };
      const sectionName = sectionNames[currentSection] || currentSection;

      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'addAlert',
            week: currentWeek || 'S30',
            section: sectionName,
            message: msg
          })
        });

        closeAlertModal();
        alert("¡Alerta enviada a mantenimiento correctamente!");
        setTimeout(fetchData, 1500);
      } catch (err) {
        console.error(err);
        alert("Error al enviar la alerta.");
      }
    }

    async function resolveMaintenanceAlert(sheetRow) {
      if (!confirm("¿Marcar esta incidencia como solucionada?")) return;

      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'resolveAlert',
            rowIndex: sheetRow
          })
        });

        setTimeout(fetchData, 1500);
      } catch (err) {
        console.error(err);
        alert("Error al actualizar la incidencia.");
      }
    }

    function getExtractedFields(row) {
      let clienteVal = '';
      let espesorVal = '';
      let especieVal = '';
      let ovVal = '';
      let ofVal = '';
      let semVal = '';
      let allText = '';

      for (let k in row) {
        let kUpper = k.toUpperCase().trim();
        let val = String(row[k] || '').trim();

        if (kUpper.includes('CLIENTE')) clienteVal = val.toLowerCase();
        if (kUpper.includes('ESPESOR')) espesorVal = val.toLowerCase();
        if (kUpper.includes('ESPECIE') || kUpper.includes('MATERIAL') || kUpper.includes('CHAPA')) especieVal = val.toLowerCase();
        if (kUpper.includes('Nº OV') || kUpper.includes('OV') || kUpper.includes('PEDIDO')) ovVal = val.toLowerCase();
        if (kUpper.includes('OF') || kUpper.includes('ORDEN')) ofVal = val.toLowerCase();
        if (kUpper === 'SEM' || kUpper === 'SEMANA') semVal = val;

        allText += ' ' + val.toLowerCase();
      }

      return {
        cliente: clienteVal,
        espesor: espesorVal,
        especie: especieVal,
        ov: ovVal,
        of: ofVal,
        sem: semVal,
        full: allText.trim()
      };
    }

    function isEwood(row) {
      const f = getExtractedFields(row);
      return f.especie.includes('ewood') || f.full.includes('ewood');
    }

    function rowsMatch(sourceRow, targetRow) {
      let src = getExtractedFields(sourceRow);
      let tgt = getExtractedFields(targetRow);

      if (src.ov && tgt.ov && src.ov === tgt.ov) return true;
      if (src.of && tgt.of && src.of === tgt.of) return true;

      let srcNum = (src.ov || src.of).match(/\b\d{2,6}\b/);
      let tgtNum = (tgt.ov || tgt.of).match(/\b\d{2,6}\b/);
      if (srcNum && tgtNum && srcNum[0] === tgtNum[0]) return true;

      let clientMatch = false;
      if (src.cliente && tgt.cliente) {
        clientMatch = src.cliente.includes(tgt.cliente) || tgt.cliente.includes(src.cliente);
      }

      let thicknessMatch = (src.espesor && tgt.espesor) ? (src.espesor === tgt.espesor) : false;

      return clientMatch && thicknessMatch;
    }

    function isCompletedInSection(week, sectionCode, targetRow, rowIndex = -1) {
      const weekData = fullData.data && fullData.data[week] ? fullData.data[week] : {};
      const sourceRows = weekData[sectionCode] || [];

      if (sectionCode === 'PROD' && currentSection === 'MAS' && rowIndex >= 0) {
        const prodKey = `${week}-PROD-${rowIndex}`;
        if (completedRows[prodKey]) return true;
      }

      for (let i = 0; i < sourceRows.length; i++) {
        const key = `${week}-${sectionCode}-${i}`;
        if (completedRows[key]) {
          if (rowsMatch(sourceRows[i], targetRow)) return true;
        }
      }
      return false;
    }

    function extractOrderNumber(row) {
      let fields = getExtractedFields(row);
      let match = fields.full.match(/\b\d{3,8}\b/);
      return match ? parseInt(match[0]) : 99999999;
    }

    function isNonEmptyRow(row) {
      if (!row) return false;
      let keys = Object.keys(row);
      let meaningfulContent = false;
      for (let k of keys) {
        let kUpper = k.toUpperCase().trim();
        let val = String(row[k] || '').trim();
        if (kUpper !== 'SEMANA' && kUpper !== 'SEM' && kUpper !== 'ESTADO' && val !== '') {
          meaningfulContent = true;
          break;
        }
      }
      return meaningfulContent;
    }

    function renderCurrentTable() {
      const headersContainer = document.getElementById('table-headers');
      const bodyContainer = document.getElementById('table-body');
      const query = document.getElementById('search-input').value.toLowerCase();

      // Sección Mantenimiento
      if (currentSection === 'MANT') {
        const alerts = fullData.alerts || [];
        headersContainer.innerHTML = `<th class="px-3 py-3 text-center">ACCIÓN</th><th class="px-3 py-3">FECHA/HORA</th><th class="px-3 py-3">SEMANA</th><th class="px-3 py-3">SECCIÓN / MÁQUINA</th><th class="px-3 py-3">INCIDENCIA</th><th class="px-3 py-3 text-center">ESTADO</th>`;
        
        if (!alerts.length) {
          bodyContainer.innerHTML = `<tr><td colspan="6" class="px-4 py-6 text-center text-slate-400">No hay avisos de mantenimiento registrados.</td></tr>`;
          return;
        }

        bodyContainer.innerHTML = alerts.map((alertItem, index) => {
          const fecha = alertItem['Fecha/Hora'] || alertItem['FECHA/HORA'] || '';
          const semana = alertItem['Semana'] || alertItem['SEMANA'] || '';
          const seccion = alertItem['Sección'] || alertItem['SECCIÓN'] || '';
          const msg = alertItem['Incidencia'] || alertItem['INCIDENCIA'] || '';
          const estado = String(alertItem['Estado'] || alertItem['ESTADO'] || '').toUpperCase();
          const isPending = estado === 'PENDIENTE';

          const sheetRow = index + 2;

          const rowClass = isPending ? 'bg-red-950/20 border-l-4 border-red-500' : 'opacity-50';
          const btnHtml = isPending 
            ? `<button onclick="resolveMaintenanceAlert(${sheetRow})" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded text-xs font-bold shadow">✓ SOLUCIONAR</button>`
            : `<span class="text-xs text-emerald-400 font-bold">RESUELTO</span>`;
          const estadoBadge = isPending 
            ? `<span class="bg-red-500/20 text-red-400 px-2.5 py-1 rounded-full text-xs font-bold border border-red-500/30">PENDIENTE</span>`
            : `<span class="bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-full text-xs font-bold border border-emerald-500/30">RESUELTO</span>`;

          return `
            <tr class="hover:bg-slate-700/50 transition ${rowClass}">
              <td class="px-3 py-3 text-center whitespace-nowrap">${btnHtml}</td>
              <td class="px-3 py-3 whitespace-nowrap text-slate-300 font-mono text-xs">${fecha}</td>
              <td class="px-3 py-3 whitespace-nowrap text-emerald-400 font-bold">${semana}</td>
              <td class="px-3 py-3 whitespace-nowrap font-semibold text-slate-200">${seccion}</td>
              <td class="px-3 py-3 text-slate-100 font-medium">${msg}</td>
              <td class="px-3 py-3 text-center whitespace-nowrap">${estadoBadge}</td>
            </tr>
          `;
        }).join('');
        return;
      }

      // Resto de Secciones
      const weekData = fullData.data && fullData.data[currentWeek] ? fullData.data[currentWeek] : {};
      let rawRows = weekData[currentSection] || [];

      let rows = rawRows.filter(isNonEmptyRow);

      if (!rows.length) {
        headersContainer.innerHTML = `<th class="px-4 py-3">Aviso</th>`;
        bodyContainer.innerHTML = `<tr><td class="px-4 py-4 text-slate-400">No hay datos válidos para la semana ${currentWeek} en esta sección.</td></tr>`;
        updateProgress(0, 0);
        return;
      }

      // Ocultar las columnas DIA y TURNO si estamos en la sección Muelle
      let displayKeys = Object.keys(rows[0]);
      if (currentSection === 'MUE') {
        displayKeys = displayKeys.filter(k => {
          let u = k.trim().toUpperCase();
          return u !== 'DIA' && u !== 'TURNO';
        });
      }

      let mappedRows = rows.map((row, originalIndex) => {
        const key = `${currentWeek}-${currentSection}-${originalIndex}`;
        return {
          row: row,
          originalIndex: originalIndex,
          isDone: !!completedRows[key],
          orderNum: extractOrderNumber(row)
        };
      });

      if (currentSection === 'MUE') {
        mappedRows.sort((a, b) => {
          if (a.isDone !== b.isDone) {
            return a.isDone ? 1 : -1;
          }
          return a.orderNum - b.orderNum;
        });
      }

      headersContainer.innerHTML = `<th class="px-3 py-3 text-center">ESTADO</th>` + displayKeys.map(k => `<th class="px-3 py-3">${k}</th>`).join('');

      let completedCount = 0;

      const filteredMappedRows = mappedRows.filter(item => {
        if (!query) return true;
        return Object.values(item.row).some(val => String(val).toLowerCase().includes(query));
      });

      mappedRows.forEach(item => {
        if (item.isDone) completedCount++;
      });

      updateProgress(completedCount, rows.length);

      bodyContainer.innerHTML = filteredMappedRows.map((item) => {
        const row = item.row;
        const originalIndex = item.originalIndex;
        const isDone = item.isDone;

        const prodDone = isCompletedInSection(currentWeek, 'PROD', row, originalIndex);
        const masDone = isCompletedInSection(currentWeek, 'MAS', row);
        const escDone = isCompletedInSection(currentWeek, 'ESC', row);
        const lijDone = isCompletedInSection(currentWeek, 'LIJ', row);

        let rowClass = '';
        if (isDone) {
          rowClass = 'completed-row';
        } else if (currentSection === 'MAS' && prodDone && !isEwood(row)) {
          rowClass = 'highlight-green';
        } else if (currentSection === 'ESC' && prodDone && isEwood(row)) {
          rowClass = 'highlight-green';
        } else if (currentSection === 'ESC' && masDone && !isEwood(row)) {
          rowClass = 'highlight-green';
        } else if (currentSection === 'LIJ' && escDone) {
          rowClass = 'highlight-green';
        } else if (currentSection === 'MUE' && lijDone) {
          rowClass = 'highlight-green';
        }

        const btnClass = isDone 
          ? "bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow hover:bg-emerald-500 transition" 
          : "bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-slate-600 transition border border-slate-600";
        const btnText = isDone ? "✓ HECHO" : "••";

        return `
          <tr id="row-${originalIndex}" class="hover:bg-slate-700/50 transition ${rowClass}">
            <td class="px-3 py-2 text-center whitespace-nowrap">
              <button onclick="toggleComplete(${originalIndex})" class="${btnClass}">
                ${btnText}
              </button>
            </td>
            ${displayKeys.map(k => `<td class="px-3 py-2 border-t border-slate-700/50 whitespace-nowrap">${row[k] || ''}</td>`).join('')}
          </tr>
        `;
      }).join('');
    }

    async function toggleComplete(index) {
      const key = `${currentWeek}-${currentSection}-${index}`;
      const willBeDone = !completedRows[key];
      completedRows[key] = willBeDone;
      localStorage.setItem('completedRows', JSON.stringify(completedRows));

      if (currentSection === 'LIJ' && willBeDone) {
        const weekData = fullData.data && fullData.data[currentWeek] ? fullData.data[currentWeek] : {};
        const rows = (weekData['LIJ'] || []).filter(isNonEmptyRow);
        const rowToCopy = rows[index];

        if (rowToCopy) {
          let copyData = Object.assign({}, rowToCopy);
          let extracted = getExtractedFields(copyData);
          
          let semNum = extracted.sem || currentWeek.replace('S','');
          if (semNum && !String(semNum).toUpperCase().startsWith('S')) {
            semNum = 'S' + semNum;
          }
          copyData["SEMANA"] = semNum;

          try {
            fetch(API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({
                action: 'copyToMuelle',
                week: currentWeek,
                rowData: copyData
              })
            }).then(() => setTimeout(fetchData, 1500));
          } catch (e) {
            console.error("Error al duplicar a Muelle:", e);
          }
        }
      }

      renderCurrentTable();
    }

    function filterTable() {
      renderCurrentTable();
    }

    function updateProgress(completed, total) {
      const counter = document.getElementById('progress-counter');
      const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
      counter.innerHTML = `Progreso: <span class="text-emerald-400 font-bold">${completed} / ${total} (${percent}%)</span>`;
    }

    function toggleFullscreen() {
      const elem = document.documentElement;
      const isInFullScreen = document.fullscreenElement || document.webkitFullscreenElement;

      if (!isInFullScreen) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen().catch(err => console.log(err));
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        } else {
          alert("Tu navegador móvil no permite pantalla completa mediante botón.");
        }
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    fetchData();
    setInterval(fetchData, 30000);
  </script>
</body>
</html>
