<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display de Planta - Control de Producción</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Fila completada manualmente */
    .completed-row {
      background-color: rgba(16, 185, 129, 0.15) !important;
      opacity: 0.6;
      text-decoration: line-through;
    }
    /* Resaltado estilo marcador verde fosforito */
    .highlight-green {
      background-color: rgba(34, 197, 94, 0.25) !important;
      border-left: 4px solid #22c55e !important;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans select-none">

  <!-- Header con Logo, Selector de Semana y Botón Kiosco -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 flex flex-wrap justify-between items-center gap-3 shadow-lg">
    <div class="flex items-center space-x-3">
      <img src="logo.png.JPG" alt="Logo Empresa" class="h-10 w-auto max-w-[120px] object-contain bg-white/5 rounded px-2 py-1" onerror="this.style.display='none'">
      <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
      <h1 class="text-lg md:text-xl font-bold tracking-wide uppercase">Mabesal</h1>
    </div>

    <div class="flex items-center space-x-3">
      <!-- Selector de Semana -->
      <div class="flex items-center space-x-2 bg-slate-700/60 px-3 py-1.5 rounded-lg border border-slate-600">
        <label for="week-select" class="text-xs font-bold uppercase text-slate-300">Semana:</label>
        <select id="week-select" onchange="changeWeek()" class="bg-slate-800 text-emerald-400 font-bold text-sm rounded px-2 py-1 outline-none border border-slate-600 cursor-pointer">
          <option value="">Cargando...</option>
        </select>
      </div>

      <!-- Botón Modo Kiosco / Pantalla Completa -->
      <button onclick="toggleFullscreen()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-600 font-bold text-xs flex items-center space-x-1 transition" title="Pantalla completa">
        <span>⛶</span>
        <span class="hidden md:inline">Kiosco</span>
      </button>

      <div class="text-xs md:text-sm text-slate-400 text-right">
        Última actualización: <span id="last-updated" class="font-mono text-emerald-400">Cargando...</span>
      </div>
    </div>
  </header>

  <!-- Pestañas de Máquinas / Secciones -->
  <nav class="bg-slate-800/50 p-2 flex space-x-2 border-b border-slate-700">
    <button id="btn-prod" onclick="switchTab('PROD')" class="flex-1 py-3 px-2 rounded-lg font-semibold text-center transition bg-blue-600 text-white shadow-md text-sm md:text-base">
      📋 Órdenes de Producción
    </button>
    <button id="btn-esc" onclick="switchTab('ESC')" class="flex-1 py-3 px-2 rounded-lg font-semibold text-center transition bg-slate-700 text-slate-300 hover:bg-slate-600 text-sm md:text-base">
      📐 Escuadradora
    </button>
    <button id="btn-lij" onclick="switchTab('LIJ')" class="flex-1 py-3 px-2 rounded-lg font-semibold text-center transition bg-slate-700 text-slate-300 hover:bg-slate-600 text-sm md:text-base">
      🪚 Lijadora
    </button>
  </nav>

  <!-- Barra de Filtro y Progreso -->
  <div class="bg-slate-800/80 px-4 py-3 flex flex-wrap justify-between items-center gap-3 border-b border-slate-700">
    <div class="flex items-center space-x-2 w-full sm:w-auto flex-1 max-w-md">
      <span class="text-slate-400">🔍</span>
      <input type="text" id="search-input" oninput="filterTable()" placeholder="Buscar por OF, cliente, chapa..." class="w-full bg-slate-900 text-slate-200 text-sm rounded-lg px-3 py-2 border border-slate-700 outline-none focus:border-blue-500">
    </div>
    <div id="progress-counter" class="text-xs md:text-sm font-semibold text-slate-300 bg-slate-900/60 px-3 py-2 rounded-lg border border-slate-700/50">
      Progreso: <span class="text-emerald-400 font-bold">0 / 0 (0%)</span>
    </div>
  </div>

  <!-- Contenido de Tablas -->
  <main class="flex-1 p-4 overflow-auto">
    <div class="bg-slate-800 rounded-xl shadow-xl overflow-hidden border border-slate-700">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-700/80 uppercase text-xs font-bold text-slate-200">
            <tr id="table-headers"></tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-700"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyJq7f4P2Qeb6lC0CurkQZTg5gVGyBJJtuVdX5A515JZeo0NnMAFEeOpggLt8ududNN/exec"; 

    let fullData = { weeks: [], data: {} };
    let currentWeek = "";
    let currentSection = "PROD";
    let completedRows = JSON.parse(localStorage.getItem('completedRows') || '{}');

    async function fetchData() {
      try {
        const response = await fetch(API_URL);
        fullData = await response.json();
        document.getElementById('last-updated').innerText = fullData.lastUpdated;

        updateWeekSelector();
        renderCurrentTable();
      } catch (error) {
        console.error("Error al obtener datos:", error);
        document.getElementById('last-updated').innerText = "Error de conexión";
      }
    }

    function updateWeekSelector() {
      const select = document.getElementById('week-select');
      if (!fullData.weeks || !fullData.weeks.length) {
        select.innerHTML = `<option value="">Sin datos</option>`;
        return;
      }

      if (!currentWeek || !fullData.weeks.includes(currentWeek)) {
        currentWeek = fullData.weeks[fullData.weeks.length - 1];
      }

      select.innerHTML = fullData.weeks.map(w => 
        `<option value="${w}" ${w === currentWeek ? 'selected' : ''}>${w}</option>`
      ).join('');
    }

    function changeWeek() {
      currentWeek = document.getElementById('week-select').value;
      renderCurrentTable();
    }

    function switchTab(section) {
      currentSection = section;
      
      const btnMap = { 'PROD': 'btn-prod', 'ESC': 'btn-esc', 'LIJ': 'btn-lij' };
      Object.keys(btnMap).forEach(sec => {
        document.getElementById(btnMap[sec]).className = "flex-1 py-3 px-2 rounded-lg font-semibold text-center transition bg-slate-700 text-slate-300 hover:bg-slate-600 text-sm md:text-base";
      });

      document.getElementById(btnMap[section]).className = "flex-1 py-3 px-2 rounded-lg font-semibold text-center transition bg-blue-600 text-white shadow-md text-sm md:text-base";
      renderCurrentTable();
    }

    // Crea una firma única combinando Cliente, Espesor y Material de la fila
    function getRowSignature(row) {
      let cliente = '';
      let espesor = '';
      let material = '';
      
      for (let k in row) {
        let kUpper = k.toUpperCase().trim();
        let val = String(row[k] || '').trim().toLowerCase();
        if (kUpper.includes('CLIENTE')) cliente = val;
        if (kUpper.includes('ESPESOR')) espesor = val;
        if (kUpper.includes('MATERIAL') || kUpper.includes('CHAPA')) material = val;
      }
      
      // Si no encuentra columnas específicas, combina todos los campos como respaldo
      if (!cliente && !espesor && !material) {
        return Object.values(row).map(v => String(v).trim().toLowerCase()).join('|');
      }
      
      return `${cliente}_${espesor}_${material}`;
    }

    // Comprueba si una fila concreta está marcada como HECHO en la sección anterior basándose en la firma
    function isCompletedInSection(week, sectionCode, targetRow) {
      const targetSig = getRowSignature(targetRow);
      if (!targetSig) return false;

      const weekData = fullData.data && fullData.data[week] ? fullData.data[week] : {};
      const sourceRows = weekData[sectionCode] || [];

      for (let i = 0; i < sourceRows.length; i++) {
        const key = `${week}-${sectionCode}-${i}`;
        if (completedRows[key]) {
          const srcSig = getRowSignature(sourceRows[i]);
          if (srcSig && srcSig === targetSig) {
            return true;
          }
        }
      }
      return false;
    }

    function renderCurrentTable() {
      const headersContainer = document.getElementById('table-headers');
      const bodyContainer = document.getElementById('table-body');
      const query = document.getElementById('search-input').value.toLowerCase();

      const weekData = fullData.data && fullData.data[currentWeek] ? fullData.data[currentWeek] : {};
      const rows = weekData[currentSection] || [];

      if (!rows.length) {
        headersContainer.innerHTML = `<th class="px-4 py-3">Aviso</th>`;
        bodyContainer.innerHTML = `<tr><td class="px-4 py-4 text-slate-400">No hay datos para la semana ${currentWeek} en esta sección.</td></tr>`;
        updateProgress(0, 0);
        return;
      }

      const keys = Object.keys(rows[0]);
      headersContainer.innerHTML = `<th class="px-3 py-3 text-center">ESTADO</th>` + keys.map(k => `<th class="px-3 py-3">${k}</th>`).join('');

      let completedCount = 0;

      const filteredRows = rows.filter(row => {
        if (!query) return true;
        return Object.values(row).some(val => String(val).toLowerCase().includes(query));
      });

      rows.forEach((row, idx) => {
        const key = `${currentWeek}-${currentSection}-${idx}`;
        if (completedRows[key]) completedCount++;
      });

      updateProgress(completedCount, rows.length);

      bodyContainer.innerHTML = filteredRows.map((row) => {
        const originalIndex = rows.indexOf(row);
        const key = `${currentWeek}-${currentSection}-${originalIndex}`;
        const isDone = !!completedRows[key];

        // Comprobar cruces encadenados por Cliente, Espesor y Material
        const prodDone = isCompletedInSection(currentWeek, 'PROD', row);
        const escDone = isCompletedInSection(currentWeek, 'ESC', row);

        let rowClass = '';
        if (isDone) {
          rowClass = 'completed-row';
        } else if (currentSection === 'ESC' && prodDone) {
          rowClass = 'highlight-green'; // Verde si el material viene hecho de Producción
        } else if (currentSection === 'LIJ' && escDone) {
          rowClass = 'highlight-green'; // Verde si el material viene hecho de Escuadradora
        }

        const btnClass = isDone 
          ? "bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow hover:bg-emerald-500 transition" 
          : "bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-slate-600 transition border border-slate-600";
        const btnText = isDone ? "✓ HECHO" : "••";

        return `
          <tr id="row-${originalIndex}" class="hover:bg-slate-700/50 transition ${rowClass}">
            <td class="px-3 py-2 text-center whitespace-nowrap">
              <button onclick="toggleComplete(${originalIndex})" class="${btnClass}">
                ${btnText}
              </button>
            </td>
            ${keys.map(k => `<td class="px-3 py-2 border-t border-slate-700/50 whitespace-nowrap">${row[k] || ''}</td>`).join('')}
          </tr>
        `;
      }).join('');
    }

    function toggleComplete(index) {
      const key = `${currentWeek}-${currentSection}-${index}`;
      completedRows[key] = !completedRows[key];
      localStorage.setItem('completedRows', JSON.stringify(completedRows));
      renderCurrentTable();
    }

    function filterTable() {
      renderCurrentTable();
    }

    function updateProgress(completed, total) {
      const counter = document.getElementById('progress-counter');
      const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
      counter.innerHTML = `Progreso: <span class="text-emerald-400 font-bold">${completed} / ${total} (${percent}%)</span>`;
    }

    function toggleFullscreen() {
      const elem = document.documentElement;
      const isInFullScreen = document.fullscreenElement || document.webkitFullscreenElement;

      if (!isInFullScreen) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen().catch(err => console.log(err));
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        } else {
          alert("Tu navegador móvil no permite pantalla completa mediante botón. Añade la página a la pantalla de inicio del dispositivo para abrirla como aplicación a pantalla completa.");
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    fetchData();
    setInterval(fetchData, 30000);
  </script>
</body>
</html>
